<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CodeType · landing</title><link rel="stylesheet" href="_mockup.css"></head>
<body>
  <div class="frame narrow" style="padding-top: 6rem;">
    <div class="mark"><span class="caret">▶</span> CodeType</div>
    <h1 style="font-size: 36px; line-height: 1.1; margin-bottom: 12px;">Type real code.</h1>
    <p style="font-size: 30px; line-height: 1.2; color: var(--ink-400); margin: 0 0 48px;">Understand real codebases.</p>
    <div style="display: flex; gap: 12px;">
      <button class="btn primary mono">Type right away &nbsp;<span style="opacity: 0.6;">↵</span></button>
      <button class="btn secondary mono">Custom</button>
    </div>
    <div class="rule" style="margin-top: 80px;"></div>
    <p class="mono" style="font-size: 11px; color: var(--ink-500); letter-spacing: 0.05em;">
      no backend · no auth · no telemetry · public repos only · all GitHub requests happen in your browser
    </p>
  </div>
