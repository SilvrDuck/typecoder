<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>CodeType · session summary</title><link rel="stylesheet" href="_mockup.css"></head>
<body>
  <div class="frame narrow" style="max-width: 48rem;">
    <div class="mark"><span class="caret">▶</span> CodeType <span class="dim">/ session complete</span></div>
    <h2 style="font-size: 24px; margin-bottom: 32px;">Session complete</h2>
    <div class="panel" style="padding: 36px 40px;">
      <div style="display: flex; gap: 64px; align-items: baseline; margin-bottom: 36px;">
        <div>
          <div class="big-num">48</div>
          <div class="legend">code wpm</div>
        </div>
        <div>
          <div class="big-num" style="color: var(--ok);">96.4%</div>
          <div class="legend">accuracy</div>
        </div>
        <div>
          <div class="big-num">12</div>
          <div class="legend">snippets</div>
        </div>
      </div>
      <div class="rule"></div>
      <div class="label" style="margin-top: 24px;">Hardest characters</div>
      <div style="display: flex; gap: 12px; margin-bottom: 24px; font-family: 'JetBrains Mono', monospace;">
        <span class="pill" style="font-size: 14px; padding: 6px 12px;">{</span>
        <span class="pill" style="font-size: 14px; padding: 6px 12px;">}</span>
        <span class="pill" style="font-size: 14px; padding: 6px 12px;">_</span>
        <span class="pill" style="font-size: 14px; padding: 6px 12px;">:</span>
      </div>
      <div class="label">Most error-prone lines</div>
      <ul class="mono" style="padding: 0; margin: 0; list-style: none; font-size: 13px; color: var(--ink-300);">
        <li style="padding: 8px 0; border-bottom: 1px solid var(--ink-700);">packages/vite/src/node/config.ts<span class="dim">:142</span></li>
        <li style="padding: 8px 0;">packages/vite/src/node/server/index.ts<span class="dim">:88</span></li>
      </ul>
    </div>
    <div style="display: flex; gap: 8px; margin-top: 24px;">
      <button class="btn primary mono">Practice weak spots</button>
      <button class="btn secondary mono">Restart session</button>
      <button class="btn ghost mono">New session</button>
    </div>
  </div>
</body></html>
